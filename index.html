<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Chocachol – 2-player board game">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Chocachol">
<title>Chocachol</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{height:100%;overscroll-behavior:none}
  body{background:linear-gradient(135deg,#0f172a,#1e1b4b)}
  .wood{background:linear-gradient(135deg,#e39b62,#c97b45);border-radius:16px;box-shadow:0 12px 30px #0008;padding:6px}
  .pc,.hint,.boom{transform-box:fill-box;transform-origin:center}
  .pc{transition:all .2s}
  .pc.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .pc.glow{animation:pulse .9s infinite}
  .hint{animation:pulse .9s infinite}
  .boom{animation:boom .8s forwards;pointer-events:none}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.3);opacity:.65}}
  @keyframes boom{0%{transform:scale(1);opacity:1}100%{transform:scale(3.2);opacity:0}}
  #toast{transition:all .3s;transform:translate(-50%,-30px);opacity:0;pointer-events:none}
  #toast.show{transform:translate(-50%,0);opacity:1}
  svg{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body class="text-slate-100">
<div id="toast" class="fixed top-16 left-1/2 z-50 bg-rose-600 text-white font-bold px-4 py-2 rounded-xl shadow-2xl text-center text-sm max-w-[90vw]"></div>

<!-- GAME SCREEN -->
<div class="h-[100dvh] max-w-md mx-auto flex flex-col p-2 gap-2">
  <div class="flex items-center gap-2">
    <button id="gear" aria-label="Settings" class="w-11 h-11 shrink-0 rounded-xl bg-slate-800 active:bg-slate-700 text-2xl">⚙️</button>
    <div id="banner" class="flex-1 rounded-xl text-center font-bold py-2 bg-slate-800 text-sm"></div>
  </div>
  <div id="chips" class="grid grid-cols-2 gap-2"></div>
  <div class="wood flex-1 min-h-0"><svg id="svg" viewBox="60 65 450 785" class="w-full h-full"></svg></div>
  <div class="flex items-center gap-2 min-h-[2.5rem] pb-1">
    <div id="msg" class="flex-1 text-xs text-slate-300 leading-snug"></div>
    <button id="endturn" class="hidden bg-amber-500 active:bg-amber-400 text-slate-900 font-bold rounded-lg px-4 py-2 text-sm">⏭ End turn</button>
  </div>
</div>

<!-- SETTINGS SCREEN -->
<div id="settings" class="hidden fixed inset-0 z-40 bg-slate-950 overflow-y-auto">
  <div class="max-w-md mx-auto p-4 space-y-4 pb-10">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold">⚙️ Settings</h2>
      <button id="close" aria-label="Close" class="w-10 h-10 rounded-lg bg-slate-800 text-xl">✕</button>
    </div>

    <section class="bg-slate-800/80 rounded-2xl p-4 space-y-3">
      <h3 class="font-bold">👥 Players &amp; Tokens</h3>
      <div class="flex items-center gap-2"><input id="col0" type="color" class="w-9 h-9 rounded bg-transparent border-0"><span class="flex-1 font-semibold text-sm">Player 1</span><label class="text-xs text-slate-400">Tokens</label><input id="n0" type="number" min="1" max="36" class="w-16 bg-slate-700 rounded px-2 py-1 text-center"></div>
      <div class="flex items-center gap-2"><input id="col1" type="color" class="w-9 h-9 rounded bg-transparent border-0"><span class="flex-1 font-semibold text-sm">Player 2</span><label class="text-xs text-slate-400">Tokens</label><input id="n1" type="number" min="1" max="36" class="w-16 bg-slate-700 rounded px-2 py-1 text-center"></div>
      <div class="flex flex-wrap items-center gap-2 text-sm"><span class="text-slate-400">Both:</span>
        <button data-v="12" class="pre bg-slate-700 rounded px-3 py-1">12</button><button data-v="22" class="pre bg-slate-700 rounded px-3 py-1">22</button>
        <button data-v="32" class="pre bg-slate-700 rounded px-3 py-1">32</button><button data-v="36" class="pre bg-slate-700 rounded px-3 py-1">36</button></div>
    </section>

    <section class="bg-slate-800/80 rounded-2xl p-4 space-y-3 text-sm">
      <h3 class="font-bold">📏 Rules</h3>
      <div><label class="block font-semibold mb-1">No direct placing in…</label>
        <select id="ban" class="w-full bg-slate-700 rounded px-2 py-2">
          <option value="none">Nowhere (place anywhere)</option>
          <option value="center">Center point only</option>
          <option value="inner">Middle 3×3 area</option>
          <option value="rect">Whole middle rectangle (triangles only)</option>
        </select>
        <p class="text-xs text-slate-400 mt-1">Those points can only be reached by a move/jump, never by placing from your hand.</p></div>
      <label class="flex gap-3 items-start"><input id="noCorner" type="checkbox" class="mt-1 w-5 h-5"><span><b>No placing on the 4 corners</b><br><span class="text-xs text-slate-400">The four corner points of the middle rectangle can only be reached by a move/jump.</span></span></label>
      <label class="flex gap-3 items-start"><input id="ghor" type="checkbox" class="mt-1 w-5 h-5"><span><b>Ghor rule (triangles)</b><br><span class="text-xs text-slate-400">No placing from your hand inside a ghor — get in by moving, or by capturing: jump over the ghor's main point from the middle side to land on its middle point or on the middle of one of its two sides. No moving straight from one ghor to another.</span></span></label>
      <label class="flex gap-3 items-start"><input id="outOfSpots" type="checkbox" class="mt-1 w-5 h-5"><span><b>No place left → counted as opponent's eaten</b><br><span class="text-xs text-slate-400">If you have no spot to place on at your turn, your hand tokens are counted as eaten by the opponent and you start moving.</span></span></label>
      <label class="flex gap-3 items-start"><input id="capOnly" type="checkbox" class="mt-1 w-5 h-5"><span><b>Place first, move later</b><br><span class="text-xs text-slate-400">While you still hold tokens, board tokens may only move to capture.</span></span></label>
      <label class="flex gap-3 items-start"><input id="chain" type="checkbox" class="mt-1 w-5 h-5"><span><b>Chain jumps</b><br><span class="text-xs text-slate-400">After a capture jump, keep jumping with the same token to eat more in one turn.</span></span></label>
      <label class="flex gap-3 items-start"><input id="trap" type="checkbox" class="mt-1 w-5 h-5"><span><b>Trap capture</b><br><span class="text-xs text-slate-400">Enemy tokens in a straight line between your landed/placed token and another of yours are all eaten.</span></span></label>
      <label class="flex gap-3 items-start"><input id="must" type="checkbox" class="mt-1 w-5 h-5"><span><b>Capture is compulsory</b><br><span class="text-xs text-slate-400">If you can capture, you must.</span></span></label>
    </section>

    <section class="bg-slate-800/80 rounded-2xl p-4 space-y-2 text-sm"><h3 class="font-bold">📲 Install App</h3>
      <button id="install" class="hidden w-full bg-indigo-600 active:bg-indigo-500 rounded-xl py-2 font-bold">Install Chocachol</button>
      <p class="text-xs text-slate-400">Android (Chrome): menu ⋮ → Install app. iPhone (Safari): Share → Add to Home Screen. Works offline after the first load.</p></section>
    <p id="err" class="text-rose-400 text-sm min-h-[1rem]"></p>
    <button id="apply" class="w-full bg-emerald-600 active:bg-emerald-500 rounded-xl py-3 font-bold">🔄 Apply &amp; Reset Game</button>

    <section class="bg-slate-800/80 rounded-2xl p-4"><h3 class="font-bold mb-2">📜 Game Log</h3>
      <div id="log" class="text-sm space-y-1 max-h-48 overflow-y-auto"></div></section>
  </div>
</div>

<script>
// ---------- Board geometry ----------
const XS=[157,221,283,346,409], YS=[200,327,456,585,713], MAXT=36;
const nodes=[], edges=new Set();
const gid=(c,r)=>r*5+c;
for(let r=0;r<5;r++)for(let c=0;c<5;c++)nodes.push({x:XS[c],y:YS[r]});
const addE=(a,b)=>edges.add(a<b?a+'-'+b:b+'-'+a);
for(let r=0;r<5;r++)for(let c=0;c<5;c++){
  if(c<4)addE(gid(c,r),gid(c+1,r));
  if(r<4)addE(gid(c,r),gid(c,r+1));
  if((r+c)%2===0)[[1,1],[1,-1]].forEach(([dc,dr])=>{const c2=c+dc,r2=r+dr;if(c2>=0&&c2<5&&r2>=0&&r2<5)addE(gid(c,r),gid(c2,r2));});
}
const ghorOf=Array(25).fill(-1),tris=[],ghorInfo=[];let gcount=0;
function tri(a,P,Q){
  const A=[nodes[a].x,nodes[a].y], mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
  const BM=mid(P,Q), pts=[P,BM,Q,mid(A,P),mid(A,Q),mid(A,BM)];
  const [bl,bm,br,ml,mr,m]=pts.map(p=>{nodes.push({x:p[0],y:p[1]});return nodes.length-1;});
  [bl,bm,br,ml,mr,m].forEach(k=>ghorOf[k]=gcount);gcount++;tris.push([A,P,Q]);ghorInfo.push([a,ml,mr]);
  [[a,ml],[ml,bl],[a,mr],[mr,br],[bl,bm],[bm,br],[a,m],[m,bm],[ml,m],[m,mr]].forEach(e=>addE(e[0],e[1]));
}
tri(gid(2,0),[197,88],[368,88]);   tri(gid(2,4),[197,825],[368,825]);
tri(gid(0,2),[83,325],[83,585]);   tri(gid(4,2),[485,325],[485,585]);
tri(gid(0,0),[93,200],[157,73]);   tri(gid(4,0),[473,200],[409,73]);
tri(gid(0,4),[93,713],[157,840]);  tri(gid(4,4),[473,713],[409,840]);

const NN=nodes.length, adj=Array.from({length:NN},()=>[]), jumps=Array.from({length:NN},()=>[]), nx=Array.from({length:NN},()=>({}));
edges.forEach(k=>{const [a,b]=k.split('-').map(Number);adj[a].push(b);adj[b].push(a);});
for(let b=0;b<NN;b++){
  const ns=adj[b];
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
    const a=ns[i],c=ns[j];
    const ux=nodes[a].x-nodes[b].x,uy=nodes[a].y-nodes[b].y,vx=nodes[c].x-nodes[b].x,vy=nodes[c].y-nodes[b].y;
    const cr=Math.abs(ux*vy-uy*vx)/(Math.hypot(ux,uy)*Math.hypot(vx,vy)), dot=ux*vx+uy*vy;
    if(cr<0.1&&dot<0){jumps[a].push({over:b,to:c});jumps[c].push({over:b,to:a});nx[a][b]=c;nx[c][b]=a;}
  }
}

// Side-middle entry: capturing the token on a ghor's main point also lets you land on the middle of
// either side of that ghor (from the best-aligned outside neighbour), for every ghor.
ghorInfo.forEach(([a,ml,mr])=>[ml,mr].forEach(sm=>{
  const dx=nodes[sm].x-nodes[a].x,dy=nodes[sm].y-nodes[a].y,dl=Math.hypot(dx,dy);
  let best=null,bc=0.9;
  adj[a].forEach(g=>{
    if(ghorOf[g]>=0)return;
    const ex=nodes[a].x-nodes[g].x,ey=nodes[a].y-nodes[g].y,c=(ex*dx+ey*dy)/(Math.hypot(ex,ey)*dl);
    if(c>bc){bc=c;best=g;}
  });
  if(best!==null&&!jumps[best].some(j=>j.over===a&&j.to===sm)){
    jumps[best].push({over:a,to:sm});jumps[sm].push({over:a,to:best});
  }
}));

// ---------- Settings & state ----------
const NAMES=['Player 1','Player 2'];
const DEF={n:[12,12],c:['#2563eb','#22c55e'],ban:'center',noCorner:true,ghor:true,outOfSpots:true,capOnly:true,chain:true,trap:false,must:false};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('chocachol')||'{}'));}catch(e){S={...DEF};}
let tok, st, logs, toastT;
const $=id=>document.getElementById(id);
const log=m=>{logs.unshift(m);if(logs.length>80)logs.pop();};
const onBoard=p=>tok.reduce((s,t)=>s+(t===p),0);
const left=p=>st.hand[p]+onBoard(p);
const CORNERS=[gid(0,0),gid(4,0),gid(0,4),gid(4,4)];
const banned=n=>(S.noCorner&&CORNERS.includes(n))||(S.ghor&&ghorOf[n]>=0)||(S.ban==='center'?n===gid(2,2):S.ban==='inner'?(n<25&&n%5>=1&&n%5<=3&&Math.floor(n/5)>=1&&Math.floor(n/5)<=3):S.ban==='rect'?n<25:false);

function newGame(){
  tok=Array(NN).fill(-1);
  st={phase:'play',turn:0,pick:null,chain:false,last:null,flash:[],hand:[S.n[0],S.n[1]],cap:[0,0],tc:0,winner:-2,msg:'',exhausted:false,superWin:false,cot:-1};
  logs=[];log(`Game started: ${S.n[0]} vs ${S.n[1]} tokens. ${NAMES[0]} goes first.`);
  render();
}

// ---------- Rules ----------
function movesOf(i,capOnly){
  const p=tok[i],r=[];
  if(!capOnly)adj[i].forEach(j=>{if(tok[j]<0&&okMove(i,j,false))r.push({to:j});});
  jumps[i].forEach(({over,to})=>{if(tok[over]===1-p&&tok[to]<0&&okMove(i,to,true))r.push({to,cap:over});});
  return r;
}
// Ghor (triangle) rule: a ghor can be entered by a normal move or by a capture jump (never placed into
// from the hand); you can never go straight from one ghor into another.
function okMove(from,to){
  if(!S.ghor)return true;
  const gt=ghorOf[to],gf=ghorOf[from];
  return !(gt>=0&&gf>=0&&gt!==gf);
}
function placeable(){return tok.some((t,i)=>t<0&&!banned(i));}
// No place left to put tokens: the hand tokens of the player to move are counted as eaten by the opponent.
function settle(q){
  if(S.outOfSpots&&st.hand[q]>0&&!placeable()){
    const o=1-q,k=st.hand[q];st.cap[o]+=k;st.hand[q]=0;
    const m=`${NAMES[q]} has no place left — ${k} hand token${k>1?'s':''} counted as eaten by ${NAMES[o]}!`;
    log('🔁 '+m);toast(m);
  }
}
const lockOf=p=>S.capOnly&&st.hand[p]>0&&placeable();
const anyCap=p=>tok.some((t,i)=>t===p&&movesOf(i,true).length>0);
function sandwich(L,p){
  const out=new Set();
  adj[L].forEach(j=>{
    const run=[];let prev=L,cur=j;
    while(cur!==undefined&&tok[cur]===1-p){run.push(cur);const n=nx[prev][cur];prev=cur;cur=n;}
    if(run.length&&cur!==undefined&&tok[cur]===p)run.forEach(x=>out.add(x));
  });
  return out;
}
function canAct(p){
  const place=st.hand[p]>0&&tok.some((t,i)=>t<0&&!banned(i));
  return place||tok.some((t,i)=>t===p&&movesOf(i,lockOf(p)).length>0);
}
function say(m){st.msg=m;render();}

function click(n){
  if(st.phase!=='play')return;
  const p=st.turn,hand=st.hand[p]>0;
  st.last=null;st.flash=[];st.msg='';
  if(st.chain){
    const m=movesOf(st.pick,true).find(x=>x.to===n);
    if(m)doMove(m);else say('Jump again with the glowing token, or press End turn.');
    return;
  }
  if(tok[n]===p){
    st.pick=st.pick===n?null:n;
    if(st.pick!==null&&lockOf(p)&&!movesOf(n,true).length){render();say(`Finish placing your tokens first — until then board tokens only move to capture.`);return;}
    render();return;
  }
  if(tok[n]>=0){render();return;}
  if(st.pick!==null){
    const m=movesOf(st.pick,lockOf(p)).find(x=>x.to===n);
    if(m){
      if(S.must&&anyCap(p)&&m.cap===undefined){say('You must capture when you can.');return;}
      doMove(m);return;
    }
  }
  if(hand){
    if(banned(n)){say("Can't place here — this spot can only be reached by a move.");return;}
    if(S.must&&anyCap(p)){say('You must capture when you can.');return;}
    tok[n]=p;st.hand[p]--;
    const caps=S.trap?sandwich(n,p):new Set();
    apply(n,caps,'placed');
    if(st.phase==='play')endTurn();
    return;
  }
  st.pick=null;render();
}

function doMove(m){
  const p=st.turn,from=st.pick;
  tok[from]=-1;tok[m.to]=p;
  const caps=new Set(m.cap!==undefined?[m.cap]:[]);
  if(S.trap)sandwich(m.to,p).forEach(x=>caps.add(x));
  apply(m.to,caps,'moved');
  if(st.phase!=='play')return;
  if(S.chain&&m.cap!==undefined&&movesOf(m.to,true).length){
    st.pick=m.to;st.chain=true;st.msg='Nice! Jump again to eat more, or press End turn.';render();return;
  }
  endTurn();
}

function apply(at,caps,verb){
  const p=st.turn,k=caps.size;
  caps.forEach(i=>tok[i]=-1);
  st.cap[p]+=k;st.tc+=k;st.last=at;st.flash=[...caps];st.pick=null;
  log(`${NAMES[p]} ${verb} a token${k?` and ate ${k}`:''}.`);
  if(left(1-p)===0){
    st.phase='over';st.winner=p;st.chain=false;flushCaps();log(`🏆 ${NAMES[p]} wins!`);render();
  }
}
function flushCaps(){
  if(st.tc>0){const m=`${NAMES[st.turn]} captured ${st.tc} token${st.tc>1?'s':''} in one move!`;log(`💥 ${m}`);toast(m);}
  st.tc=0;
}
function endTurn(){
  const p=st.turn,q=1-p;
  flushCaps();
  st.chain=false;st.pick=null;st.turn=q;
  settle(q);
  if(left(q)===1&&st.hand[q]===0){
    const i=tok.indexOf(q);
    if(i>=0&&!movesOf(i,false).length){
      st.phase='over';st.winner=p;st.superWin=true;st.cot=q;
      log(`🏆 SUPER WIN! ${NAMES[q]}'s last token is cot (trapped) — ${NAMES[p]} wins!`);
      toast(`SUPER WIN! ${NAMES[q]} is cot`);render();return;
    }
  }
  if(!canAct(q)){
    log(`${NAMES[q]} has no legal action — turn skipped.`);st.turn=p;
    if(!canAct(p)){st.phase='over';st.winner=-1;log('🤝 Nobody can move — draw!');}
  }
  render();
}
function toast(m){
  const t=$('toast');t.textContent='💥 '+m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

// ---------- Rendering ----------
function render(){
  let h='';
  tris.forEach(([A,P,Q])=>h+=`<polygon points="${A[0]},${A[1]} ${P[0]},${P[1]} ${Q[0]},${Q[1]}" fill="rgba(90,35,0,.14)"/>`);
  edges.forEach(k=>{const [a,b]=k.split('-').map(Number);h+=`<line x1="${nodes[a].x}" y1="${nodes[a].y}" x2="${nodes[b].x}" y2="${nodes[b].y}" stroke="#111" stroke-width="2.6" stroke-linecap="round"/>`;});
  nodes.forEach(n=>h+=`<circle cx="${n.x}" cy="${n.y}" r="3.5" fill="#111"/>`);
  const play=st.phase==='play';
  const hints=(play&&st.pick!==null)?movesOf(st.pick,st.chain||lockOf(st.turn)):[];
  hints.forEach(m=>{const n=nodes[m.to];h+=`<circle class="hint" cx="${n.x}" cy="${n.y}" r="8" fill="${m.cap!==undefined?'#ef4444':'#facc15'}" stroke="#111" stroke-width="1.5"/>`;});
  tok.forEach((t,i)=>{if(t<0)return;const n=nodes[i];
    h+=`<circle class="pc${st.last===i?' pop':''}${st.chain&&st.pick===i?' glow':''}" cx="${n.x}" cy="${n.y}" r="12" fill="${S.c[t]}" stroke="#fff" stroke-width="2.5"/>`;
    if(st.pick===i)h+=`<circle cx="${n.x}" cy="${n.y}" r="17" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="5 4"/>`;});
  st.flash.forEach(i=>h+=`<circle class="boom" cx="${nodes[i].x}" cy="${nodes[i].y}" r="12" fill="none" stroke="#ef4444" stroke-width="4"/>`);
  nodes.forEach((n,i)=>h+=`<circle data-n="${i}" cx="${n.x}" cy="${n.y}" r="15" fill="transparent" style="cursor:pointer"/>`);
  $('svg').innerHTML=h;

  $('chips').innerHTML=[0,1].map(i=>{
    const a=play&&st.turn===i;
    return `<div class="rounded-xl p-2 border-2" style="border-color:${a?S.c[i]:'transparent'};background:${a?S.c[i]+'33':'#1e293b'}">
      <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full border-2 border-white" style="background:${S.c[i]}"></span><span class="font-semibold text-sm flex-1">${NAMES[i]}</span><span class="text-xl font-extrabold">${left(i)}</span></div>
      <div class="text-[11px] text-slate-400">Hand ${st.hand[i]} · Board ${onBoard(i)} · Eaten ${st.cap[i]}</div></div>`;
  }).join('');

  const bn=$('banner'),p=st.turn;
  if(st.phase==='over'){
    bn.innerHTML=st.winner<0?'🤝 Draw!':`🏆 <span style="color:${S.c[st.winner]}">● ${NAMES[st.winner]}</span> ${st.superWin?'SUPER WIN!':'wins!'}`;
    bn.style.border='2px solid '+(st.winner<0?'#94a3b8':S.c[st.winner]);
  }else{
    bn.innerHTML=`<span style="color:${S.c[p]}">●</span> ${NAMES[p]}'s turn`;bn.style.border='2px solid '+S.c[p];
  }
  let msg=st.msg;
  if(!msg){
    if(st.phase==='over')msg=st.superWin?`${NAMES[st.cot]}'s last token is cot — it can't capture or move. Open ⚙️ for a new game.`:'Open ⚙️ settings to start a new game.';
    else if(st.chain)msg='Jump again with the glowing token, or press End turn.';
    else if(st.hand[p]>0)msg=S.capOnly?`Place a token (${st.hand[p]} in hand). Board tokens can only capture for now.`:`Place a token (${st.hand[p]} in hand) or move one.`;
    else msg='Select one of your tokens, then tap where to move.';
  }
  $('msg').textContent=msg;
  $('endturn').classList.toggle('hidden',!st.chain);
  $('log').innerHTML=logs.map(m=>`<div class="border-l-2 border-slate-600 pl-2">${m}</div>`).join('');
}

// ---------- Settings screen ----------
function fillForm(){
  [0,1].forEach(i=>{$('n'+i).value=S.n[i];$('col'+i).value=S.c[i];});
  $('ban').value=S.ban;['noCorner','ghor','outOfSpots','capOnly','chain','trap','must'].forEach(k=>$(k).checked=!!S[k]);$('err').textContent='';
}
function applySettings(){
  const a=Number($('n0').value),b=Number($('n1').value);
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<1||b<1||a>MAXT||b>MAXT||a+b>NN-1){
    $('err').textContent=`Tokens must be whole numbers from 1 to ${MAXT} each (total at most ${NN-1}).`;return;
  }
  S={n:[a,b],c:[$('col0').value,$('col1').value],ban:$('ban').value,noCorner:$('noCorner').checked,ghor:$('ghor').checked,outOfSpots:$('outOfSpots').checked,capOnly:$('capOnly').checked,chain:$('chain').checked,trap:$('trap').checked,must:$('must').checked};
  try{localStorage.setItem('chocachol',JSON.stringify(S));}catch(e){}
  newGame();$('settings').classList.add('hidden');
}

$('svg').addEventListener('click',e=>{const t=e.target.closest('[data-n]');if(t)click(+t.dataset.n);});
$('gear').onclick=()=>{fillForm();$('settings').classList.remove('hidden');};
$('close').onclick=()=>$('settings').classList.add('hidden');
$('apply').onclick=applySettings;
$('endturn').onclick=()=>{if(st.chain)endTurn();};
document.querySelectorAll('.pre').forEach(b=>b.onclick=()=>{$('n0').value=b.dataset.v;$('n1').value=b.dataset.v;});
let dip=null;
if(typeof window!=='undefined'){
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('install').classList.remove('hidden');});
  window.addEventListener('appinstalled',()=>{dip=null;$('install').classList.add('hidden');});
}
$('install').onclick=async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice;}catch(e){}dip=null;$('install').classList.add('hidden');};
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
newGame();
</script>
