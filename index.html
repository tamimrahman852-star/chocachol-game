<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chocachol – Board Game</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:linear-gradient(135deg,#0f172a,#1e1b4b);min-height:100vh}
  .wood{background:linear-gradient(135deg,#e39b62,#c97b45);border-radius:18px;box-shadow:0 20px 50px #0008;padding:8px}
  .pc{transition:all .2s;transform-box:fill-box;transform-origin:center}
  .pc.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  .hint{animation:pulse .9s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.35);opacity:.6}}
  svg{touch-action:manipulation}
</style>
</head>
<body class="text-slate-100 p-3 sm:p-6">
<div class="max-w-5xl mx-auto">
  <h1 class="text-3xl sm:text-4xl font-extrabold text-center mb-1 bg-clip-text text-transparent bg-gradient-to-r from-amber-300 to-pink-400">♟ Chocachol</h1>
  <p class="text-center text-slate-400 text-sm mb-3">Token boshao → Start → line borabor chalo, opponent-ke lafiye kete dao!</p>
  <div id="banner" class="rounded-xl text-center font-bold py-2 mb-4 bg-slate-800"></div>

  <div class="flex flex-col lg:flex-row gap-5 items-center lg:items-start justify-center">
    <div class="wood w-full" style="max-width:430px"><svg id="svg" viewBox="60 65 450 785" class="w-full h-auto" style="max-height:82vh"></svg></div>

    <div class="w-full max-w-[430px] lg:w-80 space-y-3">
      <div class="bg-slate-800/80 rounded-2xl p-4">
        <h2 class="font-bold mb-2">👥 Players &amp; Tokens</h2>
        <div id="players" class="space-y-2"></div>
        <p class="text-xs text-slate-400 mt-2">Setup-e kono point-e click korle token boshbe, same point-e abar click korle sorbe. Max 8 token/player.</p>
        <div class="grid grid-cols-2 gap-2 mt-3">
          <button id="undo" class="bg-slate-700 hover:bg-slate-600 disabled:opacity-40 rounded-lg py-2 text-sm">↩ Undo last</button>
          <button id="clearp" class="bg-slate-700 hover:bg-slate-600 disabled:opacity-40 rounded-lg py-2 text-sm">🗑 Clear player</button>
        </div>
        <button id="sample" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 rounded-lg py-2 text-sm">🧩 Screenshot-er moto sajao</button>
        <button id="start" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 rounded-lg py-2 font-bold">▶ Start Game</button>
        <button id="endturn" class="hidden w-full mt-2 bg-amber-500 hover:bg-amber-400 text-slate-900 rounded-lg py-2 font-bold">⏭ Turn shesh</button>
      </div>
      <div class="bg-slate-800/80 rounded-2xl p-4">
        <h2 class="font-bold mb-2">📜 Game Log</h2>
        <div id="log" class="text-sm space-y-1 h-36 overflow-y-auto"></div>
      </div>
      <button id="reset" class="w-full bg-rose-600 hover:bg-rose-500 rounded-lg py-2 font-bold">🔄 Reset Game</button>
    </div>
  </div>
</div>

<script>
// ---------- Board geometry (matches the screenshot) ----------
const XS=[157,221,283,346,409], YS=[200,327,456,585,713], MAXT=8;
const nodes=[], edges=new Set();
const gid=(c,r)=>r*5+c;
for(let r=0;r<5;r++)for(let c=0;c<5;c++)nodes.push({x:XS[c],y:YS[r]});
const addE=(a,b)=>edges.add(a<b?a+'-'+b:b+'-'+a);
for(let r=0;r<5;r++)for(let c=0;c<5;c++){
  if(c<4)addE(gid(c,r),gid(c+1,r));
  if(r<4)addE(gid(c,r),gid(c,r+1));
  if((r+c)%2===0)[[1,1],[1,-1]].forEach(([dc,dr])=>{const c2=c+dc,r2=r+dr;if(c2>=0&&c2<5&&r2>=0&&r2<5)addE(gid(c,r),gid(c2,r2));});
}
function tri(a,P,Q){
  const A=[nodes[a].x,nodes[a].y], mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
  const BM=mid(P,Q), pts=[P,BM,Q,mid(A,P),mid(A,Q),mid(A,BM)];
  const [bl,bm,br,ml,mr,m]=pts.map(p=>{nodes.push({x:p[0],y:p[1]});return nodes.length-1;});
  [[a,ml],[ml,bl],[a,mr],[mr,br],[bl,bm],[bm,br],[a,m],[m,bm],[ml,m],[m,mr]].forEach(e=>addE(e[0],e[1]));
}
tri(gid(2,0),[197,88],[368,88]);   tri(gid(2,4),[197,825],[368,825]);
tri(gid(0,2),[83,325],[83,585]);   tri(gid(4,2),[485,325],[485,585]);
tri(gid(0,0),[77,196],[155,80]);   tri(gid(4,0),[490,196],[411,80]);
tri(gid(0,4),[77,717],[155,835]);  tri(gid(4,4),[490,717],[411,835]);

const NN=nodes.length, adj=Array.from({length:NN},()=>[]), jumps=Array.from({length:NN},()=>[]);
edges.forEach(k=>{const [a,b]=k.split('-').map(Number);adj[a].push(b);adj[b].push(a);});
for(let b=0;b<NN;b++){
  const ns=adj[b];
  for(let i=0;i<ns.length;i++)for(let j=i+1;j<ns.length;j++){
    const a=ns[i],c=ns[j];
    const ux=nodes[a].x-nodes[b].x,uy=nodes[a].y-nodes[b].y,vx=nodes[c].x-nodes[b].x,vy=nodes[c].y-nodes[b].y;
    const cr=Math.abs(ux*vy-uy*vx)/(Math.hypot(ux,uy)*Math.hypot(vx,vy)), dot=ux*vx+uy*vy;
    if(cr<0.1&&dot<0){jumps[a].push({over:b,to:c});jumps[c].push({over:b,to:a});}
  }
}

// ---------- Game state ----------
const PL=[{n:'Player 1',c:'#2563eb'},{n:'Player 2',c:'#22c55e'}];
const SAMPLE=[[[0,0],[4,0],[0,2],[1,2],[4,2],[1,3],[3,3],[0,4]],[[2,0],[1,1],[2,1],[3,1],[3,2],[0,3],[2,3]]];
let tok, order, st, logs;
const $=id=>document.getElementById(id);
const log=m=>{logs.unshift(m);if(logs.length>60)logs.pop();};
const cnt=p=>tok.reduce((s,t)=>s+(t===p),0);

function init(){
  tok=Array(NN).fill(-1); order=[];
  st={phase:'setup',sel:0,turn:0,pick:null,chain:false,last:null};
  logs=[];log('Board khali. Player select kore point-e click kore token boshao.');render();
}
function movesOf(i,onlyCap){
  const p=tok[i],r=[];
  if(!onlyCap)adj[i].forEach(j=>{if(tok[j]<0)r.push({to:j});});
  jumps[i].forEach(({over,to})=>{if(tok[over]===1-p&&tok[to]<0)r.push({to,cap:over});});
  return r;
}
const anyMove=p=>tok.some((t,i)=>t===p&&movesOf(i).length);

function click(n){
  if(st.phase==='setup'){
    const p=st.sel;
    if(tok[n]===p){tok[n]=-1;order=order.filter(x=>x!==n);st.last=null;log(`${PL[p].n} er token soranor holo.`);}
    else if(tok[n]>=0)log('Ei point-e onno player-er token ache.');
    else if(cnt(p)>=MAXT)log(`${PL[p].n} er max ${MAXT} token already boshano.`);
    else{tok[n]=p;order.push(n);st.last=n;log(`${PL[p].n} token boshalo.`);}
  }else if(st.phase==='play'){
    if(st.pick!==null){
      const m=movesOf(st.pick,st.chain).find(x=>x.to===n);
      if(m){doMove(m);render();return;}
    }
    if(!st.chain&&tok[n]===st.turn)st.pick=n;
  }
  render();
}
function doMove(m){
  tok[m.to]=st.turn;tok[st.pick]=-1;st.last=m.to;
  if(m.cap!==undefined){
    tok[m.cap]=-1;log(`💥 ${PL[st.turn].n} opponent-er token kete dilo!`);
    if(cnt(1-st.turn)===0){st.phase='over';st.pick=null;st.chain=false;log(`🏆 ${PL[st.turn].n} jitse gelo!`);return;}
    if(movesOf(m.to,true).length){st.pick=m.to;st.chain=true;log('Abar capture korte paro, ba "Turn shesh" chapo.');return;}
  }
  endTurn();
}
function endTurn(){
  st.pick=null;st.chain=false;st.turn=1-st.turn;
  if(!anyMove(st.turn)){
    log(`${PL[st.turn].n} er chalar jaiga nei, turn skip.`);st.turn=1-st.turn;
    if(!anyMove(st.turn)){st.phase='over';st.turn=-1;log('🤝 Draw!');}
  }
}

// ---------- Rendering ----------
function render(){
  let h='';
  edges.forEach(k=>{const [a,b]=k.split('-').map(Number);h+=`<line x1="${nodes[a].x}" y1="${nodes[a].y}" x2="${nodes[b].x}" y2="${nodes[b].y}" stroke="#111" stroke-width="2.6" stroke-linecap="round"/>`;});
  nodes.forEach(n=>h+=`<circle cx="${n.x}" cy="${n.y}" r="3.5" fill="#111"/>`);
  const hints=(st.phase==='play'&&st.pick!==null)?movesOf(st.pick,st.chain):[];
  hints.forEach(m=>{const n=nodes[m.to];h+=`<circle class="hint" cx="${n.x}" cy="${n.y}" r="9" fill="${m.cap!==undefined?'#ef4444':'#facc15'}" stroke="#111" stroke-width="1.5"/>`;});
  tok.forEach((t,i)=>{if(t<0)return;const n=nodes[i];
    h+=`<circle class="pc${st.last===i?' pop':''}" cx="${n.x}" cy="${n.y}" r="14" fill="${PL[t].c}" stroke="#fff" stroke-width="3"/>`;
    if(st.pick===i)h+=`<circle cx="${n.x}" cy="${n.y}" r="20" fill="none" stroke="#fde047" stroke-width="3.5" stroke-dasharray="6 4"/>`;});
  nodes.forEach((n,i)=>h+=`<circle data-n="${i}" cx="${n.x}" cy="${n.y}" r="17" fill="transparent" style="cursor:pointer"/>`);
  $('svg').innerHTML=h;

  PL.forEach((p,i)=>{
    const row=$('prow'+i),active=st.phase==='setup'?st.sel===i:st.turn===i;
    row.style.borderColor=active?p.c:'transparent';row.style.background=active?p.c+'33':'#1e293b';
    $('cnt'+i).textContent=cnt(i)+'/'+MAXT;
  });
  const bn=$('banner'),pi=st.phase==='setup'?st.sel:st.turn,p=PL[pi]||{n:'',c:'#94a3b8'};
  if(st.phase==='setup')bn.innerHTML=`🛠 Setup: <span style="color:${p.c}">● ${p.n}</span> er token boshao`;
  else if(st.phase==='over')bn.innerHTML=st.turn<0?'🤝 Draw!':`🏆 <span style="color:${p.c}">● ${p.n}</span> jitse!`;
  else bn.innerHTML=`Ekhon <span style="color:${p.c}">● ${p.n}</span> er turn — ${st.pick===null?'token select koro':'jaiga select koro'}`;
  bn.style.border='2px solid '+p.c;
  const setup=st.phase==='setup';
  ['start','undo','clearp','sample'].forEach(id=>$(id).disabled=!setup);
  $('endturn').classList.toggle('hidden',!st.chain);
  $('log').innerHTML=logs.map(m=>`<div class="border-l-2 border-slate-600 pl-2">${m}</div>`).join('');
}

function buildPlayers(){
  const box=$('players');
  PL.forEach((p,i)=>{
    const row=document.createElement('div');row.id='prow'+i;
    row.className='flex items-center gap-2 p-2 rounded-xl border-2 cursor-pointer transition';
    row.innerHTML=`<input type="color" value="${p.c}" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0"><span class="flex-1 font-semibold text-sm">${p.n}</span><span id="cnt${i}" class="text-xs bg-slate-700 rounded-full px-2 py-1">0/${MAXT}</span>`;
    row.onclick=e=>{if(e.target.tagName==='INPUT')return;if(st.phase==='setup'){st.sel=i;render();}};
    row.querySelector('input').oninput=e=>{p.c=e.target.value;render();};
    box.appendChild(row);
  });
}

$('svg').addEventListener('click',e=>{const t=e.target.closest('[data-n]');if(t)click(+t.dataset.n);});
$('start').onclick=()=>{
  if(!cnt(0)||!cnt(1)){log('⚠ Duijon player-ei kombokhomo 1-ta token boshao.');render();return;}
  st.phase='play';st.turn=0;st.pick=null;st.last=null;log(`Game shuru! ${PL[0].n} prothome.`);render();
};
$('endturn').onclick=()=>{endTurn();render();};
$('undo').onclick=()=>{
  for(let k=order.length-1;k>=0;k--)if(tok[order[k]]===st.sel){tok[order[k]]=-1;order.splice(k,1);break;}
  st.last=null;render();
};
$('clearp').onclick=()=>{tok=tok.map(t=>t===st.sel?-1:t);order=order.filter(i=>tok[i]>=0);st.last=null;render();};
$('sample').onclick=()=>{
  tok.fill(-1);order=[];
  SAMPLE.forEach((list,p)=>list.forEach(([c,r])=>{tok[gid(c,r)]=p;order.push(gid(c,r));}));
  st.last=null;log('Screenshot-er layout sajano holo (Player 1: 8, Player 2: 7).');render();
};
$('reset').onclick=()=>{if(confirm('Pura game reset korbe?'))init();};
buildPlayers();init();
</script>
</body>
</html>
